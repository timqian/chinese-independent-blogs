name: Update README and feed.opml

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'blogs-original.csv'
      - 'scripts/**'
      - '.github/workflows/updateInfo.yml'
  schedule:
    # Daily: pick up the website's latest crawl status
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Lint blogs-original.csv
      run: node scripts/lint.mjs
    # Blog status comes from indi.blog, which checks every feed hourly
    - name: Download blog status into data/blogs.json
      run: node scripts/sync-status.mjs
    - name: Render README.md
      run: node scripts/render-readme.mjs
    - name: Generate feed.opml
      run: node scripts/generate-opml.mjs
    - name: Commit files
      run: |
        changes=$(git status --porcelain)
        if [ -z "$changes" ]; then
          echo "has_changes=false" >> $GITHUB_ENV
          echo "nothing to commit"
        else
          echo "has_changes=true" >> $GITHUB_ENV
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add README.md feed.opml data
          git commit -m "update README, feed.opml and data/blogs.json"
        fi
    - name: Push changes
      if: env.has_changes == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
